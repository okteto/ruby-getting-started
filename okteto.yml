build:
  dev:
    context: .
    target: dev
  hello-world:
    context: .
    target: prod
    depends_on:
      - dev

deploy:
  image: alpine/helm:4.3.2
  commands:
    - helm upgrade --install hello-world chart --set image=${OKTETO_BUILD_HELLO_WORLD_IMAGE}

test:
  unit:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    caches:
      - /usr/local/bundle
    commands:
      - bundle install
      - bundle exec ruby test/app_test.rb
    artifacts:
      - coverage

dev:
  hello-world:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: ruby app.rb
    sync:
      - .:/opt/app
    persistentVolume:
      enabled: false
    forward:
      - 1234:1234
